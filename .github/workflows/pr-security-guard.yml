name: PR Security Guard

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  statuses: read
  pull-requests: write

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Wait for Security Guard Status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for security guard commit status..."

          MAX_ATTEMPTS=20
          ATTEMPT=0
          SHA=${{ github.event.pull_request.head.sha }}
          REPO=${{ github.repository }}

          echo "Checking SHA: $SHA"
          echo "Checking REPO: $REPO"

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            RAW=$(gh api /repos/${REPO}/commits/${SHA}/statuses)
            echo "--- Raw API response (attempt $((ATTEMPT+1))) ---"
            echo "$RAW"
            echo "---------------------------------------------------"

            STATUS=$(echo "$RAW" | jq -r '[.[] | select(.context == "pr-security-guard")] | first | .state // "pending"')

            echo "Attempt $((ATTEMPT+1))/${MAX_ATTEMPTS}: Status = ${STATUS}"

            if [ "$STATUS" = "success" ]; then
              echo "✅ Security scan passed."
              exit 0
            elif [ "$STATUS" = "failure" ]; then
              echo "❌ Security scan BLOCKED this PR."
              exit 1
            fi

            ATTEMPT=$((ATTEMPT+1))
            sleep 15
          done

          echo "⚠️ Security scan timed out."
          exit 1